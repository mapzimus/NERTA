<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regional Rail | NERTA</title>
<link rel="icon" href="/assets/logo/t.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icons/t-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/t-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="NERTA">
<meta name="theme-color" content="#16161a">
<link rel="stylesheet" href="/css/site.css">
<script src="/js/common.js" defer></script>
<script src="/js/rail.js" defer></script>
</head>
<body>
<header class="page-head colored" id="head" style="background:#80276c"><div class="wrap">
  <div class="crumbs"><a href="/">Home</a> / <a href="/rail.html">Regional Rail</a> / <span id="crumb"></span></div>
  <h1 id="title" style="margin:0 0 6px"></h1>
  <p class="lede" id="blurb" style="margin:0"></p>
</div></header>
<main id="main">
  <section class="section tight"><div class="wrap"><div class="alert-item rail" id="status"></div></div></section>
  <section class="section tight"><div class="wrap grid four" id="stats"></div></section>
  <section class="section"><div class="wrap grid two" style="align-items:start">
    <div class="card"><h2>Stations</h2><div id="strip"></div></div>
    <div>
      <div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap"><h2 style="margin:0">Timetable</h2>
        <div class="row" style="flex:0 0 auto;gap:6px"><button class="btn small" id="dir-out">Outbound</button><button class="btn small ghost" id="dir-in">Inbound</button></div></div>
        <label class="field" style="margin:10px 0 0">Route<select id="route"></select></label>
        <p class="small muted" id="tt-note" style="margin:6px 0 10px"></p>
        <div class="table-scroll"><table class="data" id="timetable"></table></div>
      </div>
      <a class="map-card" id="poster" data-lightbox style="margin-top:20px;display:none"><div class="thumb" style="aspect-ratio:auto"><img id="poster-img" alt=""></div><div class="body"><b>Line map</b><span>Every station on this line. Click to enlarge.</span></div></a>
      <a class="map-card" data-release="rail" href="/assets/maps/rail_map.webp" data-lightbox data-title="Commuter and High-Speed Rail" style="margin-top:20px"><div class="thumb" style="aspect-ratio:auto"><img data-src="/assets/maps/rail_map_thumb.webp" alt="Commuter and High-Speed Rail map"></div><div class="body"><b>Rail map</b><span>Every line and station. Click to enlarge.</span></div></a>
    </div>
  </div></section>
</main>
</body>
</html>
